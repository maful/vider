version: 2
project_name: vider

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # npm matrix ships win32-x64 only
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # inject version at build time
      - -X main.version={{.Version}}

# Raw binaries instead of archives, named so scripts/pack-platform.mjs can
# wrap each one into an @vider-app/<os>-<arch> npm package.
archives:
  - formats: [binary]
    name_template: "vider_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
