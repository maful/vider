name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/vider/package-lock.json

      - name: Run Go tests
        run: go test ./...

      - name: Run Node tests
        working-directory: packages/vider
        run: |
          npm ci
          npm test

      - name: Build and upload binaries to the release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not let another tag on the commit change the build version.
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag_name }}

  smoke:
    needs: [release-please, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: vider_linux_amd64
          - os: ubuntu-24.04-arm
            asset: vider_linux_arm64
          - os: macos-latest
            asset: vider_darwin_arm64
          - os: windows-latest
            asset: vider_windows_amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the native binary from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.asset }}"

      - name: Bad root must exit 1 with the Go error
        shell: bash
        run: |
          set -uo pipefail
          chmod +x "${{ matrix.asset }}"
          set +e
          out="$(./"${{ matrix.asset }}" /nonexistent-vider-root-$$ 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "root not accessible"

  publish:
    needs: [release-please, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Check the release version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test "$TAG" = "v$VERSION" || {
            echo "tag $TAG does not match release version $VERSION"
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the built binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "vider_*" --dir dist

      - name: Generate npm packages
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: node scripts/pack-npm.mjs --version "$VERSION" --bin-dir dist --out npm-dist

      - name: Validate npm packages
        run: |
          set -euo pipefail
          for dir in npm-dist/@vider-app/*/ npm-dist/cli/; do
            npm pack "./${dir%/}" --dry-run
          done

      - name: Publish platform packages, then the main package
        run: |
          set -euo pipefail

          publish_if_missing() {
            dir="${1%/}"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              return
            fi
            npm stage publish "./$dir" --access public --provenance
          }

          for dir in npm-dist/@vider-app/*/; do
            publish_if_missing "$dir"
          done
          publish_if_missing npm-dist/cli
